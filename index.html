<!DOCTYPE html>
<html><!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Srijan's Clock</title>
  <link rel="manifest" href="manifest.json">
<style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0b0b0b;
            color: white;
            font-family: Arial, sans-serif;
        }

        .container {
            text-align: center;
            width: 100%;
        }

        .name {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 25px;
            letter-spacing: 2px;
        }

        .clock {
            width: 280px;
            height: 280px;
            border: 8px solid white;
            border-radius: 50%;
            margin: auto;
            position: relative;
            background: #151515;
            box-shadow: 0 0 30px rgba(255,255,255,0.2);
        }

        .number {
            position: absolute;
            font-size: 22px;
            font-weight: bold;
        }

        .n12 {
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
        }

        .n3 {
            right: 18px;
            top: 50%;
            transform: translateY(-50%);
        }

        .n6 {
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
        }

        .n9 {
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
        }

        .hand {
            position: absolute;
            bottom: 50%;
            left: 50%;
            transform-origin: bottom;
            border-radius: 10px;
        }

        .hour {
            width: 7px;
            height: 65px;
            background: white;
        }

        .minute {
            width: 5px;
            height: 90px;
            background: white;
        }

        .second {
            width: 2px;
            height: 105px;
            background: red;
        }

        .center {
            position: absolute;
            width: 14px;
            height: 14px;
            background: red;
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .digital {
            font-size: 42px;
            font-weight: bold;
            margin-top: 30px;
            letter-spacing: 3px;
        }

        .ampm {
            font-size: 18px;
            margin-top: 5px;
        }

        .date {
            margin-top: 15px;
            font-size: 17px;
            color: #aaa;
        }
    </style>
</head>
<script>
if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("./sw.js");
}
</script>
<body>

<div class="container">

    <div class="name">Srijan's Clock</div>

    <div class="clock">

        <div class="number n12">12</div>
        <div class="number n3">3</div>
        <div class="number n6">6</div>
        <div class="number n9">9</div>

        <div class="hand hour" id="hour"></div>
        <div class="hand minute" id="minute"></div>
        <div class="hand second" id="second"></div>

        <div class="center"></div>

    </div>

    <div class="digital" id="digital">
        00:00:00
    </div>

    <div class="ampm" id="ampm">AM</div>

    <div class="date" id="date">
        Loading...
    </div>

</div>

<script>

function updateClock() {

    let now = new Date();

    let hours = now.getHours();
    let minutes = now.getMinutes();
    let seconds = now.getSeconds();

    // Analog clock
    let hourAngle = ((hours % 12) * 30) + (minutes * 0.5);
    let minuteAngle = (minutes * 6) + (seconds * 0.1);
    let secondAngle = seconds * 6;

    document.getElementById("hour").style.transform =
        "translateX(-50%) rotate(" + hourAngle + "deg)";

    document.getElementById("minute").style.transform =
        "translateX(-50%) rotate(" + minuteAngle + "deg)";

    document.getElementById("second").style.transform =
        "translateX(-50%) rotate(" + secondAngle + "deg)";

    // Digital clock
    let ampm = hours >= 12 ? "PM" : "AM";

    let displayHours = hours % 12;

    if (displayHours === 0) {
        displayHours = 12;
    }

    displayHours = String(displayHours).padStart(2, "0");
    minutes = String(minutes).padStart(2, "0");
    seconds = String(seconds).padStart(2, "0");

    document.getElementById("digital").innerText =
        displayHours + ":" + minutes + ":" + seconds;

    document.getElementById("ampm").innerText = ampm;

    document.getElementById("date").innerText =
        now.toLocaleDateString("en-IN", {
            weekday: "long",
            day: "numeric",
            month: "long",
            year: "numeric"
        });
}

updateClock();

setInterval(updateClock, 1000);

</script>

</body>
</html>

</html>
